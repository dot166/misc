[package]
name = "downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
url = "2"
dirs = "6.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
indicatif = "0.17"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
imageproc = "0.24"
ab_glyph = "0.2"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"

