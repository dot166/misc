[versions]
agp = "9.4.1"
compose = "2.4.21"
jLib = "105.0.0"
jsoup = "1.24.1"
kotlin = "2.4.21"
ksp = "2.3.13"
patrickgold-jetpref = "0.5.0-beta01"
navigationCompose = "2.10.2"

[libraries]
jLib = { group = "io.github.dot166", name = "j-Lib", version.ref = "jLib" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
patrickgold-jetpref-datastore-model-processor = { module = "dev.patrickgold.jetpref:jetpref-datastore-model-processor", version.ref = "patrickgold-jetpref" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
