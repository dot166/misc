[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
kotlin = "2.4.20"
generateBp = "+"
lifecycleViewmodelAndroid = "2.11.0"
maven = "0.37.0"
ui = "1.12.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-android = { module = "androidx.lifecycle:lifecycle-viewmodel-android", version.ref = "lifecycleViewmodelAndroid" }
androidx-ui = { module = "androidx.compose.ui:ui", version.ref = "ui" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven" }
lineageos-generatebp = { id = "org.lineageos.generatebp", version.ref = "generateBp" }

