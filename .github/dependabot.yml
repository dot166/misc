# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/downloader/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/UTAU/libmomone/" # Location of package manifests
    schedule:
      interval: "daily"
 
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/nightstand/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/aosp/source/lib_aosp/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/aosp/source/emoji/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/aosp/source/ci-tool/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/lockdate/" # Location of package manifests
    schedule:
      interval: "daily"
