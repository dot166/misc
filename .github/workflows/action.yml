name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  filter-paths:
    runs-on: ubuntu-latest
    outputs:
      downloader_modified: ${{ steps.filter.outputs.downloader_modified }}
      utau_stuff_modified: ${{ steps.filter.outputs.utau_stuff_modified }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          downloader_modified:
            - 'downloader/**'
            - '.github/**'
          utau_stuff_modified:
            - 'UTAU/**'
            - '.github/**'

  test_downloader:
    needs: filter-paths
    if: needs.filter-paths.outputs.downloader_modified == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Test Downloader
        run: cd downloader && cargo run ./test-songs.txt

  test_libmomone:
    needs: filter-paths
    if: needs.filter-paths.outputs.utau_stuff_modified == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test LibMomone
        run: cd UTAU/libmomone && cargo test
